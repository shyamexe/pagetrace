name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the GitHub Release
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # A published version is immutable, so a tag that disagrees with
      # package.json has to stop here rather than ship the wrong number.
      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing $pkg"

      - name: Verify this version is not already published
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "::error::$name@$pkg is already on the registry"
            exit 1
          fi

      - run: npm ci
      # prepublishOnly runs typecheck, tests and build, so a broken tree
      # cannot reach the registry.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Runs only after a successful publish, so a Release never advertises a
      # version that is not on the registry. A tag on its own is invisible in
      # the repo UI; this is what people actually look for.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## \[/ || /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ] || ! grep -q '[^[:space:]]' notes.md; then
            echo "No CHANGELOG.md section for $version; falling back."
            echo "See CHANGELOG.md for details." > notes.md
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
