name: Pages

# The site embeds the rule engine, so it is rebuilt from source on every deploy.
# A committed bundle would drift from the rules it claims to run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace the one waiting, not stack behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site over the API when it does not exist yet, so
          # a first deploy does not hinge on someone finding a dropdown in
          # repository settings. Needs the pages: write permission above.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
